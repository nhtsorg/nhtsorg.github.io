<style>
  :root{ --red:#B3282D; --red-deep:#8E1F23; --ink:#1C1B1A; --paper:#FDFBF7; --line:#E4DCD2; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Public Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px}
  nav{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:50}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:70px}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--red);text-decoration:none}
  .nav-links{display:flex;gap:26px;align-items:center;font-size:15.5px;font-weight:500}
  .nav-links a{text-decoration:none;color:inherit}
  .nav-links a:hover{color:var(--red)}
  .btn{display:inline-block;padding:9px 18px;border-radius:999px;font-weight:600;text-decoration:none;font-size:15px;background:var(--red);color:#fff}
  header{padding:64px 0 36px;text-align:center}
  h1{font-family:'Fraunces',serif;font-size:clamp(36px,6vw,60px);font-weight:700}
  header p{color:#6b655e;margin-top:10px;font-size:17px}
  header p a{color:var(--red-deep)}
  .back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--red);color:var(--red);font-weight:600;font-size:15px;text-decoration:none;transition:background .2s ease,color .2s ease}
  .back:hover{background:var(--red);color:#fff}
  .grid{columns:3;column-gap:16px;padding-bottom:80px}
  .grid a{display:block;margin-bottom:16px;break-inside:avoid;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
  .grid img{width:100%;display:block;transition:transform .25s ease}
  .grid a:hover img{transform:scale(1.02)}
  footer{border-top:1px solid var(--line);padding:40px 0 56px;font-size:15px;color:#6b655e;text-align:center}
  footer a{color:var(--red-deep)}
  @media (max-width:900px){.grid{columns:2}}
  @media (max-width:560px){.grid{columns:1}.nav-links a:not(.btn){display:none}}
</style>
</head>
